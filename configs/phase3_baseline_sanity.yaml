# phase3_baseline_sanity.yaml

phase: "phase3"
seed: 42

train:
  max_epochs: 1
  batch_size: 4
  lr: 2e-4
  weight_decay: 1e-5
  precision: "16-mixed"
  grad_clip: 1.0
  log_every_n_steps: 5
  limit_train_batches: 5
  limit_val_batches: 2
  num_sanity_val_steps: 0

loss:
  w_l1: 1.0
  w_ssim: 0.2
  w_fft: 0.1

model:
  name: "fessm"
  base_ch: 48
  freq_ch: 16
  ssm_mode: "convscan"
  use_freq: false
  use_ssm_bottleneck: false
  use_ssm_decoder: false

output:
  exp_name: "phase3_baseline_sanity"
  ckpt_dir: "/content/drive/MyDrive/derain_project/outputs/ckpts/phase3_baseline_sanity"