phase: "phase2"
seed: 42

train:
  max_epochs: 50
  batch_size: 8
  lr: 1e-4
  weight_decay: 1e-5
  precision: "32-true"
  grad_clip: 0.5
  log_every_n_steps: 20
  limit_train_batches: 250
  limit_val_batches: 10
  num_sanity_val_steps: 0
  val_ratio: 0.1

loss:
  w_l1: 1.0
  w_ssim: 0.15
  w_fft: 0.05
  range_mode: "01"

model:
  name: "unet_freq"
  in_ch: 3
  out_ch: 3
  base_ch: 48
  freq_ch: 16

output:
  exp_name: "phase2_unet_freq"
  ckpt_dir: "/content/drive/MyDrive/derain_project/outputs/ckpts/phase2_unet_freq"
  result_dir: "/content/drive/MyDrive/derain_project/outputs/results/phase2_unet_freq"