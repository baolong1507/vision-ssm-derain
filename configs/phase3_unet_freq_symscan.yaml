# phase3_unet_freq_symscan.yaml
phase: "phase3"
seed: 42

train:
  max_epochs: 50
  batch_size: 8
  lr: 1e-4
  weight_decay: 1e-5
  precision: "32-true"
  grad_clip: 1.0
  log_every_n_steps: 20
  limit_train_batches: 250
  limit_val_batches: 25
  num_sanity_val_steps: 0
  val_ratio: 0.1

loss:
  w_l1: 1.0
  w_ssim: 0.2
  w_fft: 0.1
  range_mode: "01"

model:
  name: "unet_freq_symscan"
  in_ch: 3
  out_ch: 3
  base_ch: 48
  freq_ch: 16
  ssm_mode: "convscan"

output:
  exp_name: "phase3_unet_freq_symscan"
  ckpt_dir: "/content/drive/MyDrive/derain_project/outputs/ckpts/phase3_unet_freq_symscan"
  result_dir: "/content/drive/MyDrive/derain_project/outputs/results/phase3_unet_freq_symscan"