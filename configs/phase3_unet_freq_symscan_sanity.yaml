phase: "phase3"
seed: 42

train:
  max_epochs: 1
  batch_size: 1
  lr: 2e-4
  weight_decay: 1e-5
  precision: "16-mixed"
  grad_clip: 1.0
  log_every_n_steps: 1
  val_ratio: 0.1
  limit_train_batches: 5
  limit_val_batches: 2
  num_sanity_val_steps: 0

loss:
  w_l1: 1.0
  w_ssim: 0.2
  w_fft: 0.1
  range_mode: "01"

model:
  name: "unet_freq_symscan"
  in_ch: 3
  out_ch: 3
  base_ch: 48
  freq_ch: 16
  ssm_mode: "convscan"

output:
  exp_name: "phase3_unet_freq_symscan_sanity"
  ckpt_dir: "/content/drive/MyDrive/derain_project/outputs/ckpts/phase3_unet_freq_symscan_sanity"
  result_dir: "/content/drive/MyDrive/derain_project/outputs/results/phase3_unet_freq_symscan_sanity"